<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>방구석 AI 퀴즈쇼 (최종 판정 버전)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: Arial, sans-serif; color: #333;
    }
    .container {
      width: 400px; padding: 24px; border-radius: 24px;
      background: #ffffff; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }
    h1 { text-align: center; margin: 0 0 20px; font-size: 24px; color: #5a42ec; }
    .hidden { display: none !important; }
    
    /* 닉네임 입력 화면 */
    #login-screen input {
      width: 100%; padding: 12px; margin-bottom: 12px;
      border: 2px solid #ddd; border-radius: 12px; font-size: 16px; outline: none;
    }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: #5a42ec; color: white; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: 0.2s;
    }
    button:hover { background: #432bca; transform: translateY(-2px); }

    /* 게임 진행 화면 */
    .quiz-box {
      background: #f4f6f8; padding: 16px; border-radius: 14px;
      margin-bottom: 16px; min-height: 80px; display: flex;
      align-items: center; justify-content: center;
      font-size: 18px; font-weight: bold; text-align: center;
    }
    #answer-input {
      width: 100%; padding: 12px; margin-bottom: 12px;
      border: 2px solid #ddd; border-radius: 12px; font-size: 16px; text-align: center;
    }
    
    /* 실시간 점수판 */
    .scoreboard {
      margin-top: 20px; border-top: 2px dashed #ddd; padding-top: 16px;
    }
    .score-title { font-weight: bold; margin-bottom: 8px; color: #666; }
    .player-score {
      display: flex; justify-content: space-between;
      padding: 6px 0; font-size: 15px;
    }
    .is-me { color: #5a42ec; font-weight: bold; }

    /* 🎉 최종 결과 화면 스타일 */
    #result-screen {
      text-align: center; padding: 10px 0;
    }
    .final-banner {
      font-size: 48px; margin-bottom: 10px;
    }
    .my-final-score {
      font-size: 22px; font-weight: bold; color: #ff4757; margin-bottom: 24px;
      background: #ffeaa7; padding: 12px; border-radius: 12px;
    }
    .final-rank-title {
      font-size: 16px; font-weight: bold; color: #666; text-align: left;
      margin-bottom: 8px; border-bottom: 2px solid #5a42ec; padding-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎙️ AI 방구석 퀴즈쇼</h1>

    <div id="login-screen">
      <input type="text" id="nickname-input" placeholder="닉네임을 입력하세요" maxlength="10" />
      <button onclick="joinGame()">퀴즈쇼 입장하기</button>
    </div>

    <div id="game-screen" class="hidden">
      <div class="quiz-box" id="question-display">접속 중...</div>
      <input type="text" id="answer-input" placeholder="정답을 입력하고 엔터를 누르세요!" autocomplete="off" disabled />
      
      <div class="scoreboard">
        <div class="score-title">🏆 실시간 점수판</div>
        <div id="score-list"></div>
      </div>
    </div>

    <div id="result-screen" class="hidden">
      <div class="final-banner">👑</div>
      <h2>퀴즈쇼 종료!</h2>
      <div class="my-final-score" id="my-score-display">나의 최종 점수: 0점</div>
      
      <div class="final-rank-title">📊 최종 전체 순위</div>
      <div id="final-rank-list"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",          // 👈 본인의 API 키 입력
      projectId: "test-90563", 
      databaseURL: "https://test-90563-default-rtdb.firebaseio.com/", 
      appId: "YOUR_APP_ID"             // 👈 본인의 앱 ID 입력
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const roomRef = ref(db, "quiz_room");

    const quizData = [
      { q: "한국의 수도는 어디일까요?", a: "서울" },
      { q: "사과를 영어로 하면 무엇일까요?", a: "apple" },
      { q: "지구에서 가장 큰 바다는 어디일까요?", a: "태평양" },
      { q: "스마트폰의 조상 격으로, 애플이 2007년에 처음 출시한 이것은?", a: "아이폰" },
      { q: "조선시대 태조 이성계가 세운 조선의 첫 번째 법궁은?", a: "경복궁" },
      { q: "컴퓨터의 뇌 역할을 하는 핵심 중앙 처리 장치의 약자는?", a: "cpu" },
      { q: "세계에서 가장 높은 산의 이름은 무엇일까요?", a: "에베레스트" },
      { q: "물(H2O)을 구성하는 두 가지 원소는 수소와 이것입니다. 무엇일까요?", a: "산소" },
      { q: "태양계에서 가장 거대한 행성은 무엇일까요?", a: "목성" },
      { q: "대한민국의 국화(나라 꽃)는 무엇일까요?", a: "무궁화" }
    ];

    let myName = "";
    let localCurrentIndex = -1;

    function aiSpeak(text) {
      window.speechSynthesis.cancel();
      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = "ko-KR";
      speech.rate = 1.0;
      speech.pitch = 1.0;
      window.speechSynthesis.speak(speech);
    }

    window.joinGame = async function() {
      const input = document.getElementById("nickname-input");
      myName = input.value.trim();
      if (!myName) return alert("닉네임을 입력해주세요!");

      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("game-screen").classList.remove("hidden");
      document.getElementById("answer-input").disabled = false;
      document.getElementById("answer-input").focus();

      const roomSnap = await get(roomRef);
      if (!roomSnap.exists()) {
        await set(roomRef, {
          currentIndex: 0,
          players: { [myName]: 0 },
          lastEvent: `${myName}님이 입장하셨습니다.`
        });
      } else {
        const data = roomSnap.val();
        const updatedPlayers = { ...data.players };
        if (updatedPlayers[myName] === undefined) {
          updatedPlayers[myName] = 0; 
        }
        await update(roomRef, {
          players: updatedPlayers,
          lastEvent: `${myName}님이 입장하셨습니다.`
        });
      }

      startListening();
    };

    function startListening() {
      onValue(roomRef, (snapshot) => {
        if (!snapshot.exists()) return;
        const data = snapshot.val();
        
        const serverIndex = data.currentIndex || 0;
        const players = data.players || {};
        const lastEvent = data.lastEvent || "";

        // 1. 실시간 점수판 업데이트
        updateScoreboard(players, "score-list");

        // 🏁 2. 모든 문제가 끝났을 때 결과 화면 전환 처리
        if (serverIndex >= quizData.length) {
          document.getElementById("game-screen").classList.add("hidden");
          document.getElementById("result-screen").classList.remove("hidden");
          
          // 내 최종 합산 점수 띄우기
          const myFinalScore = players[myName] || 0;
          document.getElementById("my-score-display").innerText = `나의 최종 점수: ${myFinalScore}점 / 10점`;
          
          // 결과창용 최종 순위 리스트 업데이트
          updateScoreboard(players, "final-rank-list");

          if (localCurrentIndex !== serverIndex) {
            aiSpeak(`모든 퀴즈가 종료되었습니다! 당신의 최종 점수는 ${myFinalScore}점입니다. 수고하셨습니다.`);
            localCurrentIndex = serverIndex;
          }
          return;
        }

        // 3. 문제 변경 및 TTS 제어
        if (localCurrentIndex !== serverIndex) {
          localCurrentIndex = serverIndex;
          const newQuestion = quizData[serverIndex].q;
          document.getElementById("question-display").innerText = `Q(${serverIndex + 1}/10). ${newQuestion}`;
          document.getElementById("answer-input").value = "";
          
          aiSpeak(`${lastEvent} 다음 문제입니다. ${newQuestion}`);
        } else if (lastEvent && lastEvent.includes("입장")) {
          aiSpeak(lastEvent);
        }
      });
    }

    //
